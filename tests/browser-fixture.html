<!doctype html>
<meta charset="utf-8">
<title>Precision Gauge visual smoke</title>
<pre id="results" data-status="pending">RUNNING</pre>
<script>
(async()=>{
 const output=document.querySelector('#results');
 const check=(condition,message)=>{if(!condition)throw Error(message)};
 const outcomes=[];
 for(const [width,height] of [[390,844],[375,740],[320,667],[768,900]]){
  const iframe=document.createElement('iframe');
  iframe.style.cssText='border:0;display:block;width:'+width+'px;height:'+height+'px';
  iframe.src='/index.html?browser-smoke='+width;
  document.body.append(iframe);
  await new Promise((resolve,reject)=>{iframe.addEventListener('load',resolve,{once:true});iframe.addEventListener('error',()=>reject(Error('iframe load failed')),{once:true})});
  const w=iframe.contentWindow,d=iframe.contentDocument;
  check(d.querySelector('#tab-batch'),'Batch navigation tab missing at '+width);
  const dock=d.querySelector('.dock'),rect=dock.getBoundingClientRect();
  check(w.getComputedStyle(dock).position==='fixed','Dock not fixed at '+width);
  check(Math.abs(rect.bottom-(height-2))<=1.5,'Dock bottom differs at '+width+': '+rect.bottom);
  check(Math.abs(rect.width-Math.min(d.documentElement.clientWidth*.87, width>=700?510:640))<=1.5,'Dock width differs at '+width+' actual='+rect.width+' clientWidth='+d.documentElement.clientWidth);
  check(Math.abs((rect.left+rect.right)/2-d.documentElement.clientWidth/2)<=1.5,'Dock not centered at '+width);
  check(d.documentElement.scrollWidth<=width+1,'Horizontal overflow at '+width);
  if(width===390){const calcBottom=d.querySelector('#view-calc').getBoundingClientRect().bottom;check(calcBottom<=rect.top-2,'Calc overlaps dock at '+width+': calcBottom='+calcBottom+' dockTop='+rect.top);check(d.documentElement.scrollHeight<=height+1,'Calculator unexpectedly scrolls at '+width+': scrollHeight='+d.documentElement.scrollHeight)}
  check(d.querySelector('[data-theme-choice="auto"]'),'System theme button missing at '+width);
  d.querySelector('#tab-settings').click();
  check(d.querySelector('.settings-version').textContent.trim()==='V 3.0','Version not updated at '+width);
  const help=d.querySelector('#engineering-help');
  check(help && !help.open,'Engineering help should start collapsed at '+width);
  const helpBounds=help.getBoundingClientRect();
  if(width===390)check(helpBounds.bottom<=rect.top-4,'Settings content obscured by dock at '+width+': helpBottom='+helpBounds.bottom+' dockTop='+rect.top);
  check(d.querySelectorAll('.theme-option svg').length===3,'Theme SVG icons missing at '+width);
  for(const icon of d.querySelectorAll('.theme-option svg'))check(icon.getBoundingClientRect().width<=21,'Theme icon overflow at '+width);
  help.open=true;
  check(help.open && help.querySelectorAll('p').length===3,'Engineering help cannot expand at '+width);
  w.scrollTo(0,d.documentElement.scrollHeight);
  const openedHelp=help.getBoundingClientRect();
  check(openedHelp.bottom<=rect.top-4,'Expanded help must be readable above dock at '+width+': bottom='+openedHelp.bottom);
  help.open=false;
  w.scrollTo(0,0);
  d.querySelector('[data-theme-choice="light"]').click();
  check(d.documentElement.dataset.theme==='light','Titanium theme did not apply at '+width);
  d.querySelector('[data-theme-choice="auto"]').click();
  check(d.querySelector('[data-theme-choice="auto"]').getAttribute('aria-pressed')==='true','System theme selection failed at '+width);
  d.querySelector('[data-theme-choice="dark"]').click();
  check(d.documentElement.dataset.theme==='dark','Graphite theme did not apply at '+width);
  d.querySelector('#tab-calc').click();
  for(const field of ['nominal','upper','lower','measured']){
   const el=d.getElementById(field);
   check(parseFloat(w.getComputedStyle(el).fontSize)>=16,'Small input font '+field+' at '+width);
  }
  const measured=d.querySelector('#measured');
  measured.value='25,051';measured.dispatchEvent(new w.Event('input',{bubbles:true}));
  check(d.querySelector('#status').textContent.includes('ВЫШЕ'),'Upper limit indicator broken at '+width);
  check(d.querySelector('#result-card').dataset.state==='bad','Result accent not reflecting reject at '+width);
  measured.value='24,999';measured.dispatchEvent(new w.Event('input',{bubbles:true}));
  check(d.querySelector('#status').textContent.includes('НИЖЕ'),'Lower limit indicator broken at '+width);
  measured.value='25,032';measured.dispatchEvent(new w.Event('input',{bubbles:true}));
  check(d.querySelector('#status').textContent.includes('В ДОПУСКЕ'),'Good state broken at '+width);
  check(d.querySelector('#result-card').dataset.state==='good','Result accent not reflecting good measurement at '+width);
  measured.value='';measured.dispatchEvent(new w.Event('input',{bubbles:true}));
  check(d.querySelector('#status').textContent.includes('ОЖИДАНИЕ'),'Waiting state broken at '+width);
  check(d.querySelector('#result-card').dataset.state==='empty','Result accent should reset on empty measurement at '+width);
  d.querySelector('#mode-iso').click();
  d.querySelector('#nominal').value='12';d.querySelector('#nominal').dispatchEvent(new w.Event('input',{bubbles:true}));
  d.querySelector('#fit').value='h';d.querySelector('#fit').dispatchEvent(new w.Event('change',{bubbles:true}));
  d.querySelector('#grade').value='6';d.querySelector('#grade').dispatchEvent(new w.Event('change',{bubbles:true}));
  measured.value='11,994';measured.dispatchEvent(new w.Event('input',{bubbles:true}));
  check(d.querySelector('#target').textContent==='11,9945','Half-micrometre midpoint was rounded at '+width);
  check(d.querySelector('#delta').textContent.includes('-0,0005'),'Exact delta was rounded away at '+width);
  d.querySelector('#mode-manual').click();
  d.querySelector('#nominal').value='25,000';d.querySelector('#nominal').dispatchEvent(new w.Event('input',{bubbles:true}));
  measured.value='';measured.dispatchEvent(new w.Event('input',{bubbles:true}));
  d.querySelector('#save-result').click();
  d.querySelector('#tab-history').click();
  check(!d.querySelector('#history-panel-batches').hidden,'Batch history should be default at '+width);
  d.querySelector('#history-mode-calcs').click();
  check(d.querySelector('#history-list .history-entry'),'History not displayed at '+width);
  check(d.querySelector('#history-total').textContent.includes('запис'),'History count missing at '+width);
  d.querySelector('#history-mode-batches').click();
  d.querySelector('#tab-batch').click();
  check(!d.querySelector('#view-batch').hidden,'Batch screen did not open at '+width);
  d.querySelector('#batch-new').click();
  check(!d.querySelector('#batch-creation').hidden,'New batch form did not open at '+width);
  d.querySelector('#batch-name').value='UI smoke '+width;
  d.querySelector('#batch-create').click();
  check(d.querySelector('#batch-count').textContent==='0','Batch creation failed at '+width);
  const input=d.querySelector('#batch-measurement');
  input.value='25,025';d.querySelector('#batch-add').click();
  check(d.querySelector('#batch-count').textContent==='1','Measure not recorded at '+width);
  check(d.querySelector('#batch-good').textContent==='1','Good sample not counted at '+width);
  input.value='25,051';d.querySelector('#batch-add').click();
  check(d.querySelector('#batch-bad').textContent==='1','Reject not counted at '+width);
  d.querySelector('#batch-undo').click();
  check(d.querySelector('#batch-bad').textContent==='0','Undo did not work at '+width);
  check(d.querySelector('#batch-count').textContent==='1','Undo did not restore count at '+width);
  check(d.querySelector('#batch-chart').childElementCount>0,'Trend SVG missing at '+width);
  check(d.querySelector('#batch-inspector-value').textContent.includes('25,025'),'Incorrect last reading detail at '+width);
  input.value='25,051';d.querySelector('#batch-add').click();
  check(d.querySelector('#batch-inspector-state').textContent.includes('ВЫШЕ'),'Inspector did not flag out-of-range reading at '+width);
  const points=d.querySelectorAll('#batch-chart [data-reading-id]');
  check(points.length===2,'Expected two selectable chart points at '+width);
  points[0].querySelector('circle:last-child').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));
  check(d.querySelector('#batch-inspector-value').textContent.includes('25,025'),'Touch point selection failed at '+width);
  d.querySelectorAll('#batch-chart [data-reading-id]')[1].dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
  check(d.querySelector('#batch-inspector-state').textContent.includes('ВЫШЕ'),'Keyboard selection failed at '+width);
  check(d.querySelector('#batch-inspector-detail').textContent.includes('от цели'),'Delta details missing at '+width);
  d.querySelector('#tab-history').click();
  check(d.querySelectorAll('.history-batch-card').length>0,'Saved batch history not shown at '+width);
  d.querySelector('#history-filter-good').click();
  check(d.querySelectorAll('.history-batch-card').length===0,'Rejected batch must not be in good-only filter at '+width);
  d.querySelector('#history-filter-bad').click();
  check([...d.querySelectorAll('.history-batch-card')].some(card=>card.textContent.includes('UI smoke '+width)),'Reject-only filter did not show the batch at '+width);
  [...d.querySelectorAll('.history-batch-card')].find(card=>card.textContent.includes('UI smoke '+width)).click();
  check(!d.querySelector('#view-batch').hidden,'Open saved batch did not navigate at '+width);
  outcomes.push(width+'x'+height+': PASS');
  iframe.remove();
 }
 output.dataset.status='ok';
 output.textContent=outcomes.join('\n');
})().catch(error=>{const output=document.querySelector('#results');output.dataset.status='fail';output.textContent='FAIL '+error.stack});
</script>
